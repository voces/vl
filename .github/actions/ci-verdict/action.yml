# How much of ci.yml this run repeats: scripts/ci-verdict.sh decides, this wraps it for the
# three jobs that start the run (ci, seed, ci-embed-seed). Needs a full-history checkout and
# a token with `actions: read` (and `statuses: read` + `pull-requests: read` for `gated`).
name: ci-verdict
description: Decide full / inherit / gated for this CI run

inputs:
  docs_only:
    description: the docs-only action's output
    required: true
  modes:
    description: which shortcuts this job may take ("inherit", "gated")
    default: inherit gated

outputs:
  mode:
    description: '"full", "inherit" or "gated"'
    value: ${{ steps.decide.outputs.mode }}
  heavy:
    description: '"true" when the job runs its heavy steps (not docs-only, not inherited)'
    value: ${{ steps.heavy.outputs.heavy }}
  gated:
    description: '"true" when the queue gated this exact tree (master pushes only)'
    value: ${{ steps.decide.outputs.mode == 'gated' }}

runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      run: ./scripts/ci-verdict.sh
      env:
        GH_TOKEN: ${{ github.token }}
        MODES: ${{ inputs.modes }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        REF: ${{ github.ref }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PR_BEFORE: ${{ github.event.before }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
    - id: heavy
      shell: bash
      run: |
        if [ "${{ inputs.docs_only }}" != true ] && [ "${{ steps.decide.outputs.mode }}" != inherit ]; then
          echo "heavy=true" >> "$GITHUB_OUTPUT"
        else
          echo "heavy=false" >> "$GITHUB_OUTPUT"
        fi
