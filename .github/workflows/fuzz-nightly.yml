# Nightly randomized-seed rep-composition fuzz sweep (Phase 0 item 3,
# docs/internals/codebase-audit-2026-07.md): scripts/rep-fuzz-check.sh (the `ci-native` gate) only
# ever samples the same 16 FROZEN seeds — proven three times now to under-cover the shape space
# (fresh seeds still find unsound output: 16 shapes in 80,000 programs over the four legs, measured
# 2026-11-14). This workflow runs scripts/fuzz-sweep.sh against a FRESH batch of random seeds every
# night, so coverage grows over time instead of staying pinned to the same net forever.
#
# Host + seed build mirrors the `ci-native` job in ci.yml (same steps, same cache keys) so this
# workflow benefits from the same warm caches and never drifts from how the native toolchain is
# normally built.
#
# Outcome (scripts/fuzz-sweep.sh --gate-all --filed scripts/fuzz-filed.txt):
#   - an INVALID-WASM / TRAP / MISMATCH on any leg that no OPEN inventory row files -> job FAILS,
#     with the shape and the exact `scripts/fuzz-vl.sh --seed S --count C --depth D` repro.
#   - a finding scripts/fuzz-filed.txt lists under an open row, or a new REJECT -> reported in the
#     job summary, job SUCCEEDS.
#   Either way the artifact carries each leg's summary, shapes and keep dirs, and each unsound
#   finding's row draft (`keep_<seed>/case_N.row.md`, scripts/fuzz-draft-rows.sh).
#
# The chosen seeds are printed early in the log (scripts/fuzz-nightly.sh), so any run — nightly or
# a workflow_dispatch — is reproducible from the log alone.

name: fuzz-nightly

# Nightly on GitHub (owner ruling pending): one `fuzz-sweep.sh` run over the four legs, every leg
# gating, red only on an unsound finding no open inventory row files (scripts/fuzz-filed.txt).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of fresh random seeds to sample, per leg"
        required: false
        default: "50"
      count:
        description: "Programs generated per seed"
        required: false
        default: "200"
      depths:
        description: "Space-separated depths, cycled round-robin across seeds"
        required: false
        default: "4 5 6"

permissions:
  contents: read

env:
  # The same fixed feature level as ci.yml, which shares this seed cache namespace.
  VL_ISA: x86-64-v3

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The seed's compiled forms live in a private cache outside the checkout (DECISIONS.md,
      # "The seed sidecar lives only in the user's private cache"); the seed cache steps save it.
      - name: Seed cache location
        run: echo "VL_SEED_CACHE_DIR=$RUNNER_TEMP/vl-seed-cache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      # deno serves only scripts/refresh-compiler.sh's own tooling needs (none directly here) —
      # kept for parity with ci-native's seed-refresh path, which assumes deno is on PATH for
      # scripts/fetch-seed.sh's cold-cache fallback tooling.
      - id: setup-deno-fuzz-1
        continue-on-error: true
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # github.com release downloads 504 intermittently; npm carries deno too.
      - if: steps.setup-deno-fuzz-1.outcome == 'failure'
        run: npm i -g deno@2 && deno --version

      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # Mirrors ci.yml's ci-native job: rustc version in the cache key so a toolchain bump is a
      # clean miss (rebuild once, resave) instead of a stale-restore/never-resave trap.
      - name: Rustc version (cargo cache key)
        id: rustc
        run: echo "v=$(rustc -V | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo + vl-host target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/vl-host/target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock') }}-${{ hashFiles('scripts/vl-host/Cargo.toml', 'scripts/vl-host/build.rs', 'scripts/vl-host/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-
            cargo-${{ runner.os }}-

      - name: Cache vl-host binary
        id: vlbin
        uses: actions/cache@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: vl-bin-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/Cargo.toml', 'scripts/vl-host/build.rs', 'scripts/vl-host/src/**', 'compiler/check_intrinsics.vl') }}

      - name: Build vl-host (native tool)
        if: steps.vlbin.outputs.cache-hit != 'true'
        run: cargo build --release
        working-directory: scripts/vl-host

      - name: Cache seed compiler wasm
        uses: actions/cache@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            ${{ runner.temp }}/vl-seed-cache
          key: vl-seed4-${{ runner.os }}-${{ hashFiles('compiler/*.vl') }}
          restore-keys: |
            vl-seed4-${{ runner.os }}-

      - name: Refresh seed + native fixpoint (self-reproduction ladder)
        run: ./scripts/refresh-compiler.sh --prove-fixpoint
        env:
          GH_TOKEN: ${{ github.token }}

      # Only the proven seed's compiled forms go into the seed cache entry, not every rung's.
      - name: Trim the seed cache to the proven seed
        run: ./scripts/seed-cache-trim.sh

      # The four legs (plain, branching, multiobs, declared), each fanning its seeds over the
      # runner's 4 vCPUs, then a row draft for each unsound finding (fuzz-draft-rows.sh). Every
      # leg gates; a finding scripts/fuzz-filed.txt lists under an OPEN row is reported, not red.
      - name: Fuzz sweep (fresh random seeds, four legs)
        run: |
          ./scripts/fuzz-sweep.sh \
            --seeds "${{ inputs.seeds || '50' }}" \
            --count "${{ inputs.count || '200' }}" \
            --depths "${{ inputs.depths || '4 5 6' }}" \
            --jobs 4 \
            --gate-all \
            --filed scripts/fuzz-filed.txt \
            --out-dir /tmp/fuzz-sweep

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-nightly-findings
          path: |
            /tmp/fuzz-sweep/*/seed_*.tsv
            /tmp/fuzz-sweep/*/keep_*/
            /tmp/fuzz-sweep/*/summary.md
          if-no-files-found: ignore
          retention-days: 14
