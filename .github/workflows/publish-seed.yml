# Publish the rolling seed release (genesis without TypeScript; see
# docs/genesis-design.md).
#
# Freshness invariant this workflow maintains:
#
#   > the published seed can compile *current* master.
#
# Each master push compiles a new seed by SELF-compiling current source with the
# PREVIOUS published seed (restored from cache, or fetched from `seed-latest`),
# gates it through native-fixpoint.sh (stage3 == stage4 byte-for-byte), then
# re-points the rolling `seed-latest` pre-release at the new seed. Consumers
# never need a per-commit seed: fetch-seed.sh always pulls `seed-latest` and
# refresh-compiler.sh self-compiles current source with it; compatibility is
# proven at use time by the same fixpoint gate, so there is no version-matching
# logic. The fixpoint is a hard GATE — if it does not hold the job fails and
# `seed-latest` stays pinned to the last-good seed.
#
# Repo/tag knobs mirror fetch-seed.sh so the producer and the consumer stay
# consistent (VL_SEED_REPO default voces/vl, VL_SEED_TAG default seed-latest).

name: publish-seed

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Mirror fetch-seed.sh: the producer and the consumer must agree on where the
  # rolling seed lives.
  VL_SEED_REPO: ${{ vars.VL_SEED_REPO || 'voces/vl' }}
  VL_SEED_TAG: ${{ vars.VL_SEED_TAG || 'seed-latest' }}

jobs:
  publish-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Mirrors ci.yml's ci-native job (same cache keys, same skip gate): this workflow runs on
      # every master push, and an uncached `cargo build --release` cold-built vl-host each time —
      # minutes of Rust compilation for a binary ci-native had already built and cached for the
      # SAME commit. The rustc version rides the key so a toolchain bump is a clean miss (rebuild
      # once, resave) instead of a stale-restore/never-resave trap.
      - name: Rustc version (cargo cache key)
        id: rustc
        run: echo "v=$(rustc -V | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo + vl-host target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/vl-host/target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock') }}-${{ hashFiles('scripts/vl-host/Cargo.toml', 'scripts/vl-host/build.rs', 'scripts/vl-host/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-
            cargo-${{ runner.os }}-

      - name: Cache vl-host binary
        id: vlbin
        uses: actions/cache@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: vl-bin-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/Cargo.toml', 'scripts/vl-host/build.rs', 'scripts/vl-host/src/**') }}

      - name: Build vl-host (native tool)
        if: steps.vlbin.outputs.cache-hit != 'true'
        run: cargo build --release
        working-directory: scripts/vl-host

      # Warm path: restore the seed built by the previous master push. An exact
      # hit means the seed already matches THIS source; a restore-keys hit hands
      # refresh-compiler.sh an older seed to self-compile current source with.
      #
      # ~~The fixpoint step re-proves it regardless, so a cache hit never weakens
      # the gate.~~ THAT SENTENCE IS FALSE AND THIS PIPELINE IS CURRENTLY DOWN
      # BECAUSE OF IT (2026-08-25). An older seed is only "healthy" if it speaks
      # the same host<->seed ABI as the `vl` binary driving it. #1848 flipped a
      # string's element unit from a UTF-32 code point to a UTF-8 byte, and
      # `seed-latest` is pinned at a45c4843 — the commit IMMEDIATELY BEFORE it. So
      # a generation-1 seed is being driven by a generation-2 host, every string
      # crossing that boundary is mis-decoded, and the em dash in a diagnostic
      # (U+2014) arrives as its low byte 0x14.
      #
      # THE FIXPOINT DOES NOT CATCH IT. The corruption is SELF-CONSISTENT: stage1
      # is built with mangled string literals, stage2 and stage3 inherit them, and
      # `stage3 == stage4` holds byte-for-byte over a compiler that miscompiles.
      # This is exactly the "fixpointing-but-miscompiling seed" the corpus-oracle
      # block below was added to backstop, and the oracle IS catching it — every
      # publish-seed run since #1848 has failed there, on `@hint`/`@error` cases
      # whose expected text contains an em dash.
      #
      # WHY IT COULD NOT SELF-HEAL, and what fixed it: the two seed caches were in
      # SEPARATE NAMESPACES (see the cache step below). The warm path replayed this
      # workflow's own frozen pre-#1848 entry and the cold path fetched the equally
      # pre-#1848 `seed-latest`, so both inputs were generation 1 — while `ci.yml`
      # sat on a healthy generation-2 seed this job could not see. Sharing the
      # namespace lets `ci`'s refresh carry this job out of the hole, and the first
      # green run re-points `seed-latest` through the full gate, which repairs the
      # cold path too. No manual publish needed.
      #
      # The durable fix is the host-side check against the seed's `hostAbi()`
      # export (added in #1891, `compiler/driver.vl`): it turns this into a named
      # error at the FIRST bootstrap step, naming both generations, instead of an
      # obscure corpus failure three steps later over a corrupt candidate that
      # should never have been built. `docs/internals/cli-design.md` §"The
      # host<->seed ABI generation".
      # ONE NAMESPACE, SHARED WITH `ci.yml`. This step used to key on `vl-seed-`
      # while `ci.yml` keys on `vl-seedpair-` over the SAME `hashFiles('compiler/*.vl')`
      # input, and that split is what took this pipeline down for two days.
      #
      # Nothing but this workflow ever wrote a `vl-seed-` entry, and this workflow only
      # writes one when it SUCCEEDS — so a single failure freezes the namespace, every
      # later run restores that same frozen entry by restore-key, and the pipeline can
      # never climb out. The frozen entry was from 2026-08-23 21:01, i.e. pre-#1848, so
      # every run since bootstrapped a generation-1 seed with a generation-2 host and
      # produced the corrupt-but-fixpointing candidate the corpus oracle below rejects.
      # `ci.yml` was meanwhile passing that very same oracle on that very same commit,
      # off its own healthy `vl-seedpair-` entry — the two workflows could not see each
      # other's seeds.
      #
      # Sharing the namespace fixes it structurally rather than by hand: `ci` refreshes
      # the seed on every non-docs push, so a failure here can no longer freeze the
      # input this job bootstraps from. It costs no soundness — the fixpoint, the corpus
      # oracle and the native suites below still gate whatever is restored, which is
      # exactly how the stale entry was caught rather than published.
      #
      # The path list matches `ci.yml`'s so the two write interchangeable archives.
      - name: Cache seed compiler wasm
        uses: actions/cache@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.*.cwasm
          key: vl-seedpair-${{ runner.os }}-${{ hashFiles('compiler/*.vl') }}
          restore-keys: |
            vl-seedpair-${{ runner.os }}-

      # Cold path: with no cached seed, fetch the prior `seed-latest` so the new
      # seed is compiled by the previously published seed (self-perpetuation). A
      # present seed (cache hit) is left untouched by fetch-seed.sh.
      - name: Fetch prior seed (cold cache)
        run: ./scripts/fetch-seed.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # Self-compile current source with the seed in hand.
      - name: Refresh seed compiler wasm (self-compile)
        run: ./scripts/refresh-compiler.sh

      # The GATE: fail loudly if stage3 != stage4. `seed-latest` is only
      # re-pointed when this holds.
      - name: Native fixpoint (stage3 == stage4)
        run: ./scripts/native-fixpoint.sh

      # ---------------------------------------------------------------------
      # Corpus-oracle gate (docs/internals/codebase-audit-2026-07.md Phase 0):
      # the fixpoint above only proves stage3 == stage4 byte-for-byte — it says
      # nothing about whether the compiler still compiles CORRECTLY. A
      # fixpointing-but-miscompiling seed would sail through unblocked (this
      # workflow gated release only on the fixpoint + a `6*7` sanity check,
      # independent of the `ci`/`ci-native` CI outcome on the same commit), and
      # since the seed is the sole bootstrap source (no second compiler), a bad
      # published seed is the worst-case event. Mirrors `ci-native` in
      # .github/workflows/ci.yml: same `denoland/setup-deno@v2` + Deno-module
      # cache keyed on `deno.lock`, then the SAME two suites that job runs
      # against the seed (`tests/cases_wasm_<k>_test.ts (four shards since #2451)`, the corpus oracle at
      # `deno test -A tests/cases_wasm_<k>_test.ts (four shards since #2451)`; and the native binary suites at
      # `deno test -A --no-check --parallel tests/selfhost_native_*_test.ts
      # tests/vl_*_test.ts` under SELFHOST_NATIVE_ALIGN=1). Both suites load the
      # seed from `build/vl-compiler.wasm` by convention (see
      # tests/cases_wasm_<k>_test.ts (four shards since #2451)'s SEED constant) — the exact path
      # refresh-compiler.sh just wrote above, i.e. the CANDIDATE artifact about
      # to be published, not a stale build or the currently-live seed-latest.
      # vl-host is already built (first step), so the native suites are
      # effectively free to add here.
      # ---------------------------------------------------------------------
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Corpus oracle on the candidate seed
        run: deno test -A --parallel tests/cases_wasm_0_test.ts tests/cases_wasm_1_test.ts tests/cases_wasm_2_test.ts tests/cases_wasm_3_test.ts

      - name: Native binary suites on the candidate seed
        run: deno test -A --no-check --parallel tests/selfhost_native_*_test.ts tests/vl_*_test.ts
        env:
          SELFHOST_NATIVE_ALIGN: "1"

      # The asset contract (docs/genesis-design.md): the seed, its checksum
      # sidecar (fetch-seed.sh fails closed on mismatch), and a fingerprint over
      # the producing source plus the producing commit SHA for provenance.
      - name: Assemble release assets
        run: |
          cd build
          sha256sum vl-compiler.wasm > vl-compiler.wasm.sha256
          src_hash="$(sha256sum ../compiler/*.vl | sha256sum | cut -d' ' -f1)"
          {
            echo "source-sha256: $src_hash"
            echo "commit:        $GITHUB_SHA"
          } > seed-fingerprint.txt

      # Re-point the rolling `seed-latest` pre-release at the new seed. The tag is
      # continuously overwritten (a moving "latest" pointer, not a version);
      # softprops/action-gh-release re-creates/updates the release in place. This
      # mirrors the release mechanism the release.yml publish TODO already names.
      - name: Publish to rolling seed-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VL_SEED_TAG }}
          name: Rolling seed (latest)
          prerelease: true
          # Move the tag onto the producing commit each run so the rolling release
          # tracks the seed it actually published.
          target_commitish: ${{ github.sha }}
          files: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.sha256
            build/seed-fingerprint.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
