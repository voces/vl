name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch enough history for `git diff` to compare against the base.
          # On push events base_sha is available; on PRs we need the base ref.
          fetch-depth: 0

      # Docs-only gate — the shared detection (one implementation for both
      # jobs, so they cannot drift) lives in .github/actions/docs-only; heavy
      # steps below skip when it reports true and the job exits green, keeping
      # the required status check satisfied.
      - name: Detect docs-only change
        id: docs_check
        uses: ./.github/actions/docs-only

      - uses: denoland/setup-deno@v2
        if: steps.docs_check.outputs.docs_only != 'true'
        with:
          deno-version: v2.x

      # The LSP bundle is built with esbuild over node-resolved deps (binaryen,
      # vscode-languageserver*), so Node + node_modules are needed for that step.
      - uses: actions/setup-node@v5
        if: steps.docs_check.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: npm

      # Deno's module cache (esbuild, the jsr loader, std) — keyed on the lockfile
      # so it's reused until a dependency moves.
      - name: Cache Deno modules
        if: steps.docs_check.outputs.docs_only != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install node deps
        if: steps.docs_check.outputs.docs_only != 'true'
        run: npm ci

      # `deno check` now covers only the surviving type leaves (coreTypes.ts,
      # diagnostics.ts) — the TS compiler core is deleted; the `.vl` compiler is
      # type-checked by the native checker (lint-self.sh in ci-native).
      - name: Type-check (compiler)
        if: steps.docs_check.outputs.docs_only != 'true'
        run: deno check compiler/*.ts

      - name: Lint
        if: steps.docs_check.outputs.docs_only != 'true'
        run: deno lint

      - name: Test (.vl corpus)
        if: steps.docs_check.outputs.docs_only != 'true'
        run: deno task test

      - name: Build LSP bundle (verify it compiles)
        if: steps.docs_check.outputs.docs_only != 'true'
        run: deno task build
        working-directory: lsp

  # ---------------------------------------------------------------------------
  # ci-native — gates the NATIVE self-hosting path (scripts/vl-host + the
  # self-host compiler wasm), end to end with zero TS/deno in the compile+run
  # loop past the seed. A SEPARATE, PARALLEL job: it never extends the `ci` job's
  # critical path (the maintainer is duration-sensitive), and a slow cold cargo
  # build here can't delay the deno suite's result.
  #
  # Steps: build the vl-host binary → refresh the seed compiler wasm + prove the
  # native fixpoint (the self-reproduction ladder: an observed
  # `compile(X, source) == X` byte-equality for the shipped seed) → self-lint in
  # the background while the native corpus alignment + `build -O` suites run
  # (env-gated, drive the corpus through `vl`).
  #
  # Caching: ubuntu-latest ships cargo, so we cache ~/.cargo + the cargo target
  # dir (cold wasmtime build ~2-4 min, warm seconds — busted only when
  # scripts/vl-host/Cargo.lock changes), the finished `vl` binary (skips cargo
  # entirely when rustc + lockfile + crate source are unchanged), and the seed +
  # its `.cwasm` sidecars keyed on the compiler source it was built from. The
  # binary cache is restored FIRST and gates the target-dir restore: on the 97.9%
  # of runs where it hits, this job runs no cargo at all and skips the ~1.2 GB
  # download entirely.
  #
  # The release DISTRIBUTION build (`--features embed-seed`) used to be the last
  # step here; it is now the parallel `ci-embed-seed` job, because it was the only
  # reason this job restored the cargo target dir at all.
  #
  # Docs-only skip is mirrored from `ci` so a docs-only PR exits this job green
  # too (keeping the stable job name satisfied for branch protection).
  # ---------------------------------------------------------------------------
  ci-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Docs-only gate — the same shared detection the `ci` job uses (see
      # .github/actions/docs-only).
      - name: Detect docs-only change
        id: docs_check
        uses: ./.github/actions/docs-only

      # deno serves only the test tooling in this job (the corpus oracle + native
      # suites). The seed is obtained natively — cache, else the release seed via
      # scripts/fetch-seed.sh — so no Node/npm is needed here (the TS stage-0
      # toolchain that required binaryen from npm is off this path).
      - uses: denoland/setup-deno@v2
        if: steps.docs_check.outputs.docs_only != 'true'
        with:
          deno-version: v2.x

      - name: Cache Deno modules
        if: steps.docs_check.outputs.docs_only != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # Cargo registry/index + the vl-host target dir — needed ONLY when the
      # binary cache below missed and `cargo build` has to run.
      # Cold wasmtime build is the only real cost here; warm restores drop it to
      # seconds.
      #
      # The rustc version is part of the key ON PURPOSE: a target dir compiled by
      # one rustc is fully fingerprint-invalidated under the next (ubuntu-latest
      # bumps rustc often), AND actions/cache skips saving when the primary key
      # already exists — so without the version in the key, one toolchain bump
      # locks every later run into "restore stale → recompile all of wasmtime
      # cold → never resave". Versioned keys make a bump a clean miss: rebuild
      # once, save, warm thereafter. The broader restore-keys still carry the
      # registry/index across versions (downloads are version-agnostic).
      #
      # The crate SOURCE is deliberately NOT in the key. It used to be, to keep the
      # embedded-seed step from rebuilding against stale fingerprints — but that step
      # rebuilds the crate on EVERY run regardless: `build.rs` declares
      # `rerun-if-changed` on the seed wasm, and the seed-refresh step rewrites it
      # earlier in the same job. So a src-keyed entry preserved nothing, while making
      # every host-source commit miss and re-upload the whole ~1.2 GB target dir
      # (~15s, and a fresh cache entry each time — at a 10 GB repo quota that evicts
      # the cargo entry itself, whose next miss is a ~2m19s cold wasmtime build).
      # Keyed on the lockfile + manifest instead, the deps that dominate those bytes
      # are re-saved only when they actually change; `actions/cache` skips saving on
      # an exact hit, so ordinary commits upload nothing. What a src change still
      # costs is one crate rebuild (~8s) — which it costs either way, since a changed
      # src invalidates the crate's fingerprint no matter what the key says.
      - name: Rustc version (cargo cache key)
        if: steps.docs_check.outputs.docs_only != 'true'
        id: rustc
        run: echo "v=$(rustc -V | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      # The finished `vl` binary, keyed on EVERYTHING that determines it (rustc,
      # Cargo.lock, the crate source). An exact hit means cargo would reproduce
      # this same binary, so the build step is skipped outright — and "the host
      # still compiles" stays covered every run regardless: the `ci-embed-seed`
      # job compiles the same crate (a feature superset) from scratch inputs.
      #
      # Restored BEFORE the cargo/target cache on purpose. An exact hit here means
      # NOTHING in this job runs cargo, so the ~1.2 GB target-dir restore can be
      # skipped outright — and it is the second-largest step in the job (17 s
      # median; measured 2026-07-29 over the last 30 full master-push runs). The
      # hit rate is 97.9% (377/385 full runs since 07-15): only a
      # `scripts/vl-host/src/**`, `build.rs`, manifest or lockfile change misses,
      # and on a miss the gated restore below runs exactly as it did before.
      - name: Cache vl-host binary
        if: steps.docs_check.outputs.docs_only != 'true'
        id: vlbin
        uses: actions/cache@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: vl-bin-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/Cargo.toml', 'scripts/vl-host/build.rs', 'scripts/vl-host/src/**') }}

      # GATED on the binary cache missing: this job's ONLY cargo consumer is the
      # build step below, which is gated on the same condition. `ci-embed-seed`
      # restores (and saves) this same cache under the same key, so a lockfile or
      # toolchain move still populates it; this job just stops paying a 17 s
      # download for a target dir it will not open.
      - name: Cache cargo + vl-host target
        if: steps.docs_check.outputs.docs_only != 'true' && steps.vlbin.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/vl-host/target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-
            cargo-${{ runner.os }}-

      - name: Build vl-host (native tool)
        if: steps.docs_check.outputs.docs_only != 'true' && steps.vlbin.outputs.cache-hit != 'true'
        run: cargo build --release
        working-directory: scripts/vl-host

      # The rolling seed cache (F-tiers): an exact hit means the seed was built
      # from THIS compiler source; a restore-keys hit hands refresh-compiler.sh a
      # healthy older seed to SELF-compile current source with. On a cold cache
      # refresh-compiler.sh fetches the release seed (scripts/fetch-seed.sh)
      # rather than TS-minting. The fixpoint ladder below re-proves the seed
      # every run, so neither a cache hit nor a fetched seed weakens the gate.
      #
      # The `.cwasm` sidecars (the host's wasmtime-compilation cache) ride along:
      # on an exact hit every `vl` invocation in the job deserializes instead of
      # re-JITing the seed. The glob is load-bearing — there is one sidecar per
      # ENGINE CONFIGURATION (`build/vl-compiler.wasm.<engine tag>.cwasm`), so that
      # `vl build`/`vl run` and `vl check`/`fmt`/`test`, which compile the seed
      # differently, keep separate entries instead of evicting each other. A sidecar
      # from a different wasmtime version carries a different tag and is simply not
      # read, and an unreadable one at a live path makes the host recompile + rewrite
      # (self-healing), so a stale sidecar can cost time but never correctness.
      - name: Cache seed compiler wasm
        if: steps.docs_check.outputs.docs_only != 'true'
        uses: actions/cache@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.*.cwasm
          key: vl-seedpair-${{ runner.os }}-${{ hashFiles('compiler/*.vl') }}
          restore-keys: |
            vl-seedpair-${{ runner.os }}-

      # Self-compile current source with the seed AND prove the shipped seed is a
      # self-compilation fixed point (`--prove-fixpoint`): the ladder stops at the
      # first stage X with an OBSERVED `compile(X, source) == X` byte-equality —
      # the same witness the classic stage3/stage4 rebuild produced, without
      # recompiling byte-identical inputs. An exact seed-cache hit proves out in
      # ONE compiler self-compile (the seed reproduces itself); a stale
      # restore-keys/fetched seed climbs the classic two or three rungs. On a cold
      # cache refresh-compiler.sh fetches the release `seed-latest` (one push
      # stale is fine — the ladder re-proves it); a seed too stale to compile
      # current source fails loud (re-fetch seed-latest / land the change in
      # smaller steps). GH_TOKEN lets fetch-seed.sh use `gh release download` on
      # the cold path.
      - name: Refresh seed + native fixpoint (self-reproduction ladder)
        if: steps.docs_check.outputs.docs_only != 'true'
        run: ./scripts/refresh-compiler.sh --prove-fixpoint
        env:
          GH_TOKEN: ${{ github.token }}

      # Dogfood: `vl` lints + fmt-checks its own source (`compiler/*.vl` + driver
      # + `std/`), gated at `info` (prefer-const / unused / warnings / errors all
      # fail). STARTED here, in the background, so it overlaps the deno-driven
      # native suites below (they only read the same binary + seed; nothing
      # writes either until the embedded-seed step, which is fenced behind the
      # result step). The exit code + log are collected by "Self-lint (result)".
      - name: Self-lint (start, concurrent with the native suites)
        if: steps.docs_check.outputs.docs_only != 'true'
        run: |
          # Fully detached (stdio closed off the step's pipes), so the step
          # returns immediately instead of the runner waiting on the held pipe.
          # `timeout` is belt-and-suspenders: a hang (should not happen now the
          # .cwasm sidecar publishes atomically, but the poll below is unbounded)
          # exits 124 into the .rc, so "Self-lint (result)" fails FAST with the log
          # instead of the whole job stalling until the workflow-level limit.
          #
          # `set +e` FIRST, and it is the whole reason this reports anything useful.
          # The step shell is `bash -e`, and a subshell INHERITS errexit — so on the
          # one outcome this harness exists to report, a FAILING lint, the subshell
          # aborted at the non-zero `timeout` and never reached the `echo`. The result
          # step then polled a file that would never appear and blamed a "died without
          # writing its rc" it had itself caused, burning the full 450s poll and hiding
          # the diagnostics in an uncollected log. A real `prefer-const` finding was
          # reported this way as an infrastructure hang.
          # A LEFTOVER rc would make the result step break out of its poll on the first
          # iteration and exit 0 — a green lint that never ran. Inert on a fresh
          # ubuntu-latest VM; not inert on a self-hosted runner.
          rm -f /tmp/lint-self.rc /tmp/lint-self.log
          ( set +e
            timeout 420 ./scripts/lint-self.sh > /tmp/lint-self.log 2>&1
            echo $? > /tmp/lint-self.rc ) < /dev/null > /dev/null 2>&1 &

      # Fuzzing is NOT part of CI (2026-07-22): the pinned-seed rep-fuzz check is
      # deterministic (16 frozen seeds -> identical programs every run), so re-running it
      # per PR only re-proved facts that don't change between commits — every finding it
      # ever caught is entombed as a tests/cases/ regression (the standing rule), which the
      # suites below execute. Exploratory fuzzing runs LOCALLY (scripts/fuzz-sweep.sh fans
      # fresh seeds across all cores; scripts/rep-fuzz-check.sh remains in the local
      # pre-push gate), and each new finding is fixed + pinned as a test, not re-fuzzed.

      # The native-binary suites (env-gated, drive `vl` against the seed) are
      # discovered by convention — `selfhost_native_*` (corpus alignment / -O /
      # conversion / diag positions) and `vl_*` (the `vl` CLI: check, fmt, …) — so
      # a new native test is picked up by naming alone, no edit here.
      # `--parallel` fans the test FILES across the cores (one worker process
      # each); every case spawns its own `vl` subprocess, so cases are isolated
      # regardless of schedule.
      - name: Native binary suites (corpus alignment, build -O, vl CLI)
        if: steps.docs_check.outputs.docs_only != 'true'
        run: deno test -A --no-check --parallel tests/selfhost_native_*_test.ts tests/vl_*_test.ts
        env:
          SELFHOST_NATIVE_ALIGN: "1"

      # The corpus oracle on the wasm compiler (cases_wasm_test.ts): the full
      # directive corpus adjudicated by the refreshed seed under Deno. Explicit
      # here because only this job has a seed — in the `ci` job's `deno task
      # test` the file self-ignores (no build/vl-compiler.wasm).
      - name: Corpus oracle on the wasm compiler
        if: steps.docs_check.outputs.docs_only != 'true'
        run: deno test -A tests/cases_wasm_test.ts

      # The seed-backed LSP / playground editor-feature suites (semantic tokens,
      # hover, inlay hints, completion, the wasm-checker driver, cross-file
      # go-to-def / references, member completion, unused-export hints). Like
      # cases_wasm, they gate on build/vl-compiler.wasm and self-ignore in the
      # `ci` job (no seed); only THIS job has the refreshed seed, so they're run
      # explicitly here — otherwise they'd execute nowhere in CI. The set is
      # enforced complete by tests/ci_seed_coverage_test.ts (a seed-backed test
      # added without wiring it in here fails that guard, in the `ci` job).
      - name: Editor features on the wasm compiler
        if: steps.docs_check.outputs.docs_only != 'true'
        run: >-
          deno test -A --no-check
          tests/lsp_semantic_tokens_test.ts
          tests/lsp_inlay_hint_test.ts
          tests/lsp_undisplayable_type_test.ts
          tests/lsp_wasm_checker_test.ts
          tests/lsp_crossfile_test.ts
          tests/lsp_crossfile_wasm_test.ts
          tests/lsp_crossfile_refs_wasm_test.ts
          tests/lsp_member_completion_wasm_test.ts
          tests/lsp_unused_export_wasm_test.ts
          tests/lsp_large_file_wasm_test.ts
          tests/playground_lsp_wasm_test.ts
          tests/playground_completion_test.ts

      # Collect the backgrounded self-lint: wait for its rc file, replay the full
      # log, and fail the job on any lint/fmt finding. LAST step in the job — no
      # later step may touch `target/release/vl`, because lint must not race an
      # in-place binary rewrite. (That fence is why the embedded-seed build, which
      # rewrites it, is a separate job now; see `ci-embed-seed`.)
      - name: Self-lint (result)
        if: steps.docs_check.outputs.docs_only != 'true'
        run: |
          # Bounded poll: the backgrounded step wraps lint-self.sh in `timeout
          # 420`, so 450s is a safety margin over that. Without a bound, a dead
          # detached subshell (one that never reaches its own `echo $? >
          # /tmp/lint-self.rc`) would spin here until the job-level timeout
          # instead of failing fast with a clear cause.
          for _ in $(seq 1 450); do
            [ -f /tmp/lint-self.rc ] && break
            sleep 1
          done
          if [ ! -f /tmp/lint-self.rc ]; then
            echo "self-lint result never arrived after 450s. The subshell wraps" >&2
            echo "lint-self.sh in 'timeout 420' and runs under 'set +e', so a" >&2
            echo "failing OR hanging lint still writes its rc — reaching here" >&2
            echo "means the subshell itself was killed. Partial log, if any:" >&2
            cat /tmp/lint-self.log >&2 || true
            exit 1
          fi
          cat /tmp/lint-self.log
          exit "$(cat /tmp/lint-self.rc)"

  # ---------------------------------------------------------------------------
  # ci-embed-seed — the release DISTRIBUTION build (roadmap H-M2), gated on every
  # push instead of only at release time.
  #
  # A SEPARATE, PARALLEL job because it is the only remaining cargo consumer and
  # it shares nothing with `ci-native`'s suites. Measured 2026-07-29 over the last
  # 30 full master-push runs it cost that job 15 s of `cargo build` PLUS the 17 s
  # ~1.2 GB target-dir restore it was the only reason to pay — 32 s of a 89 s
  # median critical path, for work nothing downstream consumes. Out here it runs
  # concurrently and costs the wall clock nothing.
  #
  # What it asserts is UNCHANGED: `--features embed-seed` compiles, the resulting
  # binary runs from a directory with NO on-disk seed (forcing the embedded
  # fallback), and its Cranelift compilation cache materializes so a shipped `vl`
  # does not re-JIT the seed every invocation.
  #
  # The seed it embeds comes from the same rolling cache `ci-native` uses, else
  # `scripts/fetch-seed.sh`. It deliberately does NOT wait for `ci-native`'s
  # freshly refreshed seed: every assertion here is about the DISTRIBUTION
  # MECHANISM (build.rs staging, the embedded fallback, the cache key), and any
  # healthy seed exercises all of it. The seed's own correctness is proven in
  # `ci-native` by the fixpoint ladder, which is where that gate belongs.
  # ---------------------------------------------------------------------------
  ci-embed-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: docs_check
        uses: ./.github/actions/docs-only

      - name: Rustc version (cargo cache key)
        if: steps.docs_check.outputs.docs_only != 'true'
        id: rustc
        run: echo "v=$(rustc -V | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      # RESTORE-ONLY, on `ci-native`'s key. This job's target dir holds
      # `--features embed-seed` artifacts, and writing those under the shared key
      # would hand `ci-native` a target dir whose `release/vl` is the embed-seed
      # binary. `ci-native` is the writer: any input that busts this key (rustc,
      # Cargo.lock, Cargo.toml) also busts its `vl-bin` key, so it always misses,
      # restores, builds and saves. One cold wasmtime build after a toolchain bump
      # is the same cost as before the split.
      - name: Restore cargo + vl-host target
        if: steps.docs_check.outputs.docs_only != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/vl-host/target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-
            cargo-${{ runner.os }}-

      # Also RESTORE-ONLY: any healthy seed will do here (see the job header), so
      # a restore-keys hit is a full hit and the fetch below covers a cold cache —
      # while `ci-native` stays the sole writer of the seed pair, which is what
      # keeps the `.cwasm` sidecars riding along with the wasm they were built from.
      - name: Restore seed compiler wasm
        if: steps.docs_check.outputs.docs_only != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.*.cwasm
          key: vl-seedpair-${{ runner.os }}-${{ hashFiles('compiler/*.vl') }}
          restore-keys: |
            vl-seedpair-${{ runner.os }}-

      # Idempotent: fetch-seed.sh leaves a present, non-empty seed untouched.
      - name: Ensure a seed to embed
        if: steps.docs_check.outputs.docs_only != 'true'
        run: ./scripts/fetch-seed.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify embedded-seed build (distribution path)
        if: steps.docs_check.outputs.docs_only != 'true'
        run: |
          cargo build --release --features embed-seed --manifest-path scripts/vl-host/Cargo.toml
          probe="$(mktemp -d)"
          # Isolated cache dir: the embedded seed has no `build/` beside it, so its
          # Cranelift compilation is cached here instead. Cold-compiling the ~1 MB seed
          # takes SECONDS; every run after the first deserializes in milliseconds.
          export VL_CACHE_DIR="$(mktemp -d)"
          vl="$GITHUB_WORKSPACE/scripts/vl-host/target/release/vl"
          out="$(cd "$probe" && echo 'print(6 * 7)' | "$vl" run)"
          if [ "$out" != "42" ]; then
            echo "embedded-seed smoke failed: expected 42 from the embedded fallback, got: $out"
            exit 1
          fi
          # The cache must MATERIALIZE — without it the shipped binary re-compiles the
          # seed on every invocation. Deterministic check; timings are informational
          # (runner-speed dependent, so never a gate).
          if ! ls "$VL_CACHE_DIR"/seed-*.cwasm >/dev/null 2>&1; then
            echo "embedded-seed cache was not written to \$VL_CACHE_DIR — every run would re-compile the seed"
            exit 1
          fi
          out2="$(cd "$probe" && echo 'print(6 * 7)' | "$vl" run)"
          if [ "$out2" != "42" ]; then
            echo "embedded-seed cached run failed: expected 42, got: $out2"
            exit 1
          fi
          echo "embedded-seed build runs with no on-disk seed (got 42), and caches its compile:"
          ls -la "$VL_CACHE_DIR"
