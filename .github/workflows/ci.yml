name: CI

on:
  # `vl-queue/**`: the merge queue pushes the exact tree it is gating, and the run's
  # `ci-proof` job lets scripts/gate.sh skip the rows this workflow already ran on it.
  push:
    branches: [master, "vl-queue/**"]
  pull_request:
  # Nightly: the `ci-cost` job runs only off pull requests.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Compile the seed for a FIXED x86 feature level, not the runner's CPU: a `.cwasm` sidecar's
# tag then names the level, so one cached on any runner loads on every other instead of each
# job re-JITing the seed (scripts/vl-host `pin_seed_isa`). Every GitHub-hosted x86 runner is v3.
env:
  VL_ISA: x86-64-v3

jobs:
  ci:
    runs-on: ubuntu-latest
    # `actions: read` reads the previous head's CI verdict (scripts/ci-verdict.sh).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch enough history for `git diff` to compare against the base.
          # On push events base_sha is available; on PRs we need the base ref.
          # Blobless: the docs-only diff reads trees only, and a blob any later
          # step asks git for is fetched on demand.
          fetch-depth: 0
          filter: blob:none

      # Docs-only gate — the shared detection (one implementation for both
      # jobs, so they cannot drift) lives in .github/actions/docs-only; heavy
      # steps below skip when it reports true, keeping the required status check
      # satisfied. A docs-only change still runs the checks that READ docs
      # (.github/docs-checks.txt, held complete by tests/ci_docs_only_test.ts).
      - name: Detect docs-only change
        id: docs_check
        uses: ./.github/actions/docs-only

      # An inherited run (a clean catch-up merge whose previous head passed) skips the
      # heavy steps; this job's steps are not ones the queue's `gated` skips.
      - name: Decide what this run repeats
        id: verdict
        uses: ./.github/actions/ci-verdict
        with:
          docs_only: ${{ steps.docs_check.outputs.docs_only }}
          modes: inherit

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      # Every *.md is read by one of these (vl_doc_script_paths walks them all), so a
      # docs-only change is not unchecked; none of them needs the seed.
      - name: Doc checks (docs-only change)
        if: steps.docs_check.outputs.docs_only == 'true'
        run: deno test -A --no-check --parallel $(grep -v '^#' .github/docs-checks.txt)

      # The LSP bundle is built with esbuild over node-resolved deps (binaryen,
      # vscode-languageserver*), so Node + node_modules are needed for that step.
      - uses: actions/setup-node@v5
        if: steps.verdict.outputs.heavy == 'true'
        with:
          node-version: 22
          cache: npm

      # Deno's module cache (esbuild, the jsr loader, std) — keyed on the lockfile
      # so it's reused until a dependency moves.
      - name: Cache Deno modules
        if: steps.verdict.outputs.heavy == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install node deps
        if: steps.verdict.outputs.heavy == 'true'
        run: npm ci

      # `deno check` now covers only the surviving type leaves (coreTypes.ts,
      # diagnostics.ts) — the TS compiler core is deleted; the `.vl` compiler is
      # type-checked by the native checker (lint-self.sh in the `checks` job).
      - name: Type-check (compiler)
        if: steps.verdict.outputs.heavy == 'true'
        run: deno check compiler/*.ts

      # The root deno.json EXCLUDES lsp/ and the test suites run --no-check, so
      # without this step a type error in lsp/src/*.ts passes every gate and all
      # of CI, surfacing only at runtime in the editor (measured 2026-09-01 —
      # the bundler is esbuild, which strips types without checking them).
      # --node-modules-dir=none resolves the npm deps mapped in lsp/deno.json
      # from deno's own cache, never node_modules — so this grades identically
      # here and in every local layout (main checkout, agent worktrees with a
      # symlinked or absent node_modules). Without it, deno ≥2.9.6's byonm
      # nearest-manifest rule graded three different answers across those
      # layouts (measured 2026-09-01).
      - name: Type-check (lsp)
        if: steps.verdict.outputs.heavy == 'true'
        run: deno check --node-modules-dir=none --config lsp/deno.json lsp/src/*.ts

      - name: Lint
        if: steps.verdict.outputs.heavy == 'true'
        run: deno lint

      # The root deno.json EXCLUDES lsp/ from the step above — even a path passed
      # explicitly on its CLI is skipped — so lsp/src/*.ts is linted by nothing
      # without this. lsp/deno.json carries no exclude of its own.
      - name: Lint (lsp)
        if: steps.verdict.outputs.heavy == 'true'
        run: deno lint --config lsp/deno.json lsp/src/

      - name: Test (.vl corpus)
        if: steps.verdict.outputs.heavy == 'true'
        run: deno task test

      - name: Build LSP bundle (verify it compiles)
        if: steps.verdict.outputs.heavy == 'true'
        run: deno task build
        working-directory: lsp

  # ---------------------------------------------------------------------------
  # The NATIVE self-hosting path (scripts/vl-host + the self-host compiler wasm), end to
  # end with zero TS/deno in the compile+run loop past the seed, as a job GRAPH:
  #
  #   seed ──┬── ci-native (5)        the auto-discovered native suites, split by weight
  #          ├── checks               ratchets, probes, self-lint, corpus oracle, editor suites
  #          ├── ci-release-shape (4) the binaryen-backed suites, split by weight
  #          └── ci-cost (4)         fuel/RSS cost ratchets — master pushes and nightly only
  #
  # `seed` is the only job that builds anything: the vl-host binary (on a binary-cache miss)
  # and the seed, which it refreshes AND proves a self-compilation fixed point before saving
  # both under exact keys. Every downstream job restores those exact keys and FAILS on a miss
  # (`fail-on-cache-miss`), so every suite runs on the proven fixpoint of THIS commit's
  # compiler source — never on an earlier rung, and never on a seed it built itself.
  #
  # `seed` outputs `heavy` (false for a docs-only or an inherited run, which skip every
  # downstream job) and `gated`. `gated` is true only on a master push of a tree the merge
  # queue's scripts/gate.sh already passed (scripts/ci-verdict.sh), and skips just the three
  # jobs gate.sh runs whole: ci-native, ci-release-shape, ci-cost.
  # tests/ci_verdict_test.ts holds that list to what gate.sh covers.
  # ---------------------------------------------------------------------------
  seed:
    runs-on: ubuntu-latest
    # `actions: read` lets a master run find and download a pull request's proven seed, and
    # read a PR head's CI verdict; `statuses` and `pull-requests` read the queue's mark.
    permissions:
      contents: read
      actions: read
      statuses: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.verdict.outputs.heavy }}
      gated: ${{ steps.verdict.outputs.gated }}
      seed_key: ${{ steps.keys.outputs.seed }}
      bin_key: ${{ steps.keys.outputs.bin }}
      rustc: ${{ steps.keys.outputs.rustc }}
    steps:
      # Blobless full history: the docs-only diff needs the merge-base's TREES, not every
      # past blob, and the full-blob fetch was 18 s of this job's critical path.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect docs-only change
        id: docs_check
        uses: ./.github/actions/docs-only

      - name: Decide what this run repeats
        id: verdict
        uses: ./.github/actions/ci-verdict
        with:
          docs_only: ${{ steps.docs_check.outputs.docs_only }}

      # The two exact keys every downstream job restores. The binary is keyed on everything
      # that determines it (rustc, Cargo.lock, the crate source); the seed on the compiler
      # source it is the proven fixpoint of, then on what decides its sidecars (the host that
      # JITs them and the tags warm-seed.sh warms), because actions/cache never re-saves an
      # existing key and a stale sidecar would be re-JITed by every job. `vl-seed4` is ONE
      # namespace with publish-seed.yml and fuzz-nightly.yml (same paths, same `$VL_ISA`): an
      # entry carries the provenance file (`.src`) and sidecars compiled for the pinned ISA,
      # which the `vl-seedpair` ones lack.
      - name: Cache keys
        id: keys
        run: |
          echo "bin=vl-bin-${{ runner.os }}-$(rustc -V | tr ' ' '_')-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/Cargo.toml', 'scripts/vl-host/build.rs', 'scripts/vl-host/src/**', 'compiler/check_intrinsics.vl') }}" >> "$GITHUB_OUTPUT"
          echo "seed=vl-seed4-${{ runner.os }}-${{ hashFiles('compiler/*.vl') }}-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/src/**', 'scripts/warm-seed.sh') }}" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc -V | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      # An exact hit means cargo would reproduce this same binary, so the build is skipped
      # outright; "the host still compiles" stays covered every run by `ci-embed-seed`,
      # which compiles the same crate (a feature superset) from scratch inputs.
      - name: Cache vl-host binary
        if: steps.verdict.outputs.heavy == 'true'
        id: vlbin
        uses: actions/cache@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: ${{ steps.keys.outputs.bin }}

      # Restored only when the binary missed. The rustc version is in the key because a
      # target dir compiled by one rustc is fully invalidated under the next, and
      # actions/cache never re-saves an existing key. `ci-embed-seed` restores this same key.
      - name: Cache cargo + vl-host target
        if: steps.verdict.outputs.heavy == 'true' && steps.vlbin.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/vl-host/target
          key: cargo-${{ runner.os }}-${{ steps.keys.outputs.rustc }}-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.keys.outputs.rustc }}-
            cargo-${{ runner.os }}-

      - name: Build vl-host (native tool)
        if: steps.verdict.outputs.heavy == 'true' && steps.vlbin.outputs.cache-hit != 'true'
        run: cargo build --release
        working-directory: scripts/vl-host

      # The rolling seed cache: an exact hit is a seed proven from THIS compiler source (it
      # was saved only after the ladder below passed); a restore-keys hit hands
      # refresh-compiler.sh a healthy older seed to self-compile current source with; a cold
      # cache fetches the release seed. The `.cwasm` sidecars (one per engine configuration)
      # ride along, so no downstream `vl` re-JITs the seed. A stale sidecar costs time, never
      # correctness: the host recompiles one whose key does not match.
      - name: Cache seed compiler wasm
        if: steps.verdict.outputs.heavy == 'true'
        id: seedcache
        uses: actions/cache@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            build/vl-compiler.wasm.*.cwasm
          key: ${{ steps.keys.outputs.seed }}
          restore-keys: |
            vl-seed4-${{ runner.os }}-${{ hashFiles('compiler/*.vl') }}
            vl-seed4-${{ runner.os }}-

      # The seed key is content-keyed, but a pull request's cache is invisible to master, so
      # a push misses the entry its own pull request saved and climbs the ladder from an
      # older seed. A same-repository pull request run therefore also uploads its proven seed
      # as artifact `proven-<seed key>` (below), and any other run that misses the exact key
      # installs it after checking the producing run (scripts/ci-proven-seed.sh). The ladder
      # still runs: a reused seed is a better start that proves out in one compile.
      - name: Reuse a seed a pull request proved
        if: steps.verdict.outputs.heavy == 'true' && github.event_name != 'pull_request' && steps.seedcache.outputs.cache-hit != 'true'
        run: ./scripts/ci-proven-seed.sh fetch "proven-${{ steps.keys.outputs.seed }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # Self-compile current source with the seed AND prove the shipped seed is a
      # self-compilation fixed point: the ladder stops at the first stage X with an OBSERVED
      # `compile(X, source) == X` byte-equality. An exact cache hit proves out in ONE
      # self-compile; a stale seed climbs two or three rungs. Whatever rung proves out is
      # what the cache entry above saves, so every downstream job runs the proven fixpoint.
      # The two FUEL sidecars stay out of that entry (every downstream job restores it) and
      # get their own `vl-fuel-` cache, which `ci-cost` and the native shard whose files read
      # `$VL_FUEL` restore. Where `ci-cost` runs they are warmed HERE, in the background of
      # the ladder's single-threaded compiles (`--fuel-stash`): a job of their own sat in
      # series between `seed` and `ci-cost`, and a warm AFTER the ladder would delay every
      # downstream job instead.
      - name: Cache the fuel sidecars
        id: fuelcache
        if: steps.verdict.outputs.heavy == 'true' && github.event_name != 'pull_request' && steps.verdict.outputs.gated != 'true'
        uses: actions/cache@v5
        with:
          path: build/fuel-sidecars
          key: vl-fuel-${{ steps.keys.outputs.seed }}
          lookup-only: true

      - name: Refresh seed + native fixpoint (self-reproduction ladder)
        if: steps.verdict.outputs.heavy == 'true'
        run: |
          grep -m1 'model name' /proc/cpuinfo
          fuel=()
          if [ "$WANT_FUEL" = true ]; then fuel=(--fuel-stash=build/fuel-sidecars); fi
          ./scripts/refresh-compiler.sh --prove-fixpoint --no-fuel-sidecars "${fuel[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_FUEL: ${{ steps.fuelcache.outcome == 'success' && steps.fuelcache.outputs.cache-hit != 'true' }}

      # The handoff to master's run of the same seed key (see "Reuse a seed" above). A fork's
      # run uploads nothing; the reader refuses one anyway.
      - name: Checksum the proven seed for master
        id: pack
        if: steps.verdict.outputs.heavy == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: ./scripts/ci-proven-seed.sh pack

      - name: Upload the proven seed for master
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: proven-${{ steps.keys.outputs.seed }}
          # Already zstd: the sidecars are ~90 MB raw, and zip's single-threaded deflate
          # would put that on every pull request's critical path.
          path: build/proven-seed.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # ---------------------------------------------------------------------------
  # ci-native — the native-binary suites (env-gated, they drive `vl` against the seed),
  # discovered by convention: `selfhost_native_*` and `vl_*`, so a new native test is
  # picked up by naming alone. `scripts/ci-shard.sh` splits that population across the
  # matrix by measured weight and `tests/ci_shard_test.ts` holds the split to a partition.
  # Files another step names (the release-profile and cost lists) run there instead.
  # ---------------------------------------------------------------------------
  ci-native:
    needs: seed
    if: needs.seed.outputs.heavy == 'true' && needs.seed.outputs.gated != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # This job has no node_modules, so binaryen's native release is the only binaryen its
      # suites see: without it the -O, wasm-opt and wasm-dis suites ignore themselves here,
      # so a failed fetch fails the job. The cache key is the script, which carries the
      # pinned version and checksums.
      - name: Cache native binaryen
        uses: actions/cache@v5
        with:
          path: ~/.cache/vl/binaryen-*
          key: binaryen-${{ runner.os }}-${{ hashFiles('scripts/fetch-binaryen.sh') }}

      - name: Native binaryen
        run: |
          d=$(bash scripts/fetch-binaryen.sh)
          echo "VL_BINARYEN=$d" >> "$GITHUB_ENV"

      - name: Restore vl-host binary
        uses: actions/cache/restore@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: ${{ needs.seed.outputs.bin_key }}
          fail-on-cache-miss: true

      - name: Restore the proven seed
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            build/vl-compiler.wasm.*.cwasm
          key: ${{ needs.seed.outputs.seed_key }}
          fail-on-cache-miss: true

      # The fuel tags only for a shard that meters fuel; `seed` warms the rest.
      - name: Does this shard meter fuel
        id: fuel
        run: |
          files=$(bash scripts/ci-shard.sh native ${{ matrix.shard }} 7)
          # shellcheck disable=SC2086  # one argument per file
          if grep -q VL_FUEL $files; then echo "need=true" >> "$GITHUB_OUTPUT"; fi

      # The two fuel sidecars are a whole-seed JIT each, so they get their own cache keyed on
      # the seed's: the first job to warm them saves, and every later job (and a later run on
      # the same compiler) restores instead of re-JITing. `ci-cost` shares the key.
      - name: Cache the fuel sidecars
        if: steps.fuel.outputs.need == 'true'
        uses: actions/cache@v5
        with:
          path: build/fuel-sidecars
          key: vl-fuel-${{ needs.seed.outputs.seed_key }}

      # `$VL_ISA` makes the cached sidecars load on any runner, so this is near-instant; it
      # stays as the net for a runner that refuses the pinned level, where every test worker
      # would otherwise JIT the seed at once.
      - name: Warm the seed's sidecars
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if [ "${{ steps.fuel.outputs.need }}" = true ]; then
            bash scripts/warm-seed.sh --fuel --stash build/fuel-sidecars
          else
            bash scripts/warm-seed.sh
          fi

      # `--parallel` fans the test FILES across the cores (one worker process each); every
      # case spawns its own `vl` subprocess, so cases are isolated regardless of schedule.
      - name: Native binary suites (corpus alignment, build -O, vl CLI)
        run: |
          files=$(bash scripts/ci-shard.sh native ${{ matrix.shard }} 7)
          [ -n "$files" ] || { echo "native shard ${{ matrix.shard }} of 7 is empty" >&2; exit 1; }
          # shellcheck disable=SC2086  # one argument per file
          deno test -A --no-check --parallel $files
        env:
          SELFHOST_NATIVE_ALIGN: "1"
          # A SELF_SHARDED file (ci-shard.sh) runs in every shard and asserts only this share.
          VL_CI_SHARD: ${{ matrix.shard }}/7

  # ---------------------------------------------------------------------------
  # checks — the ratchets, the capability probes and the self-lint on the proven seed. The
  # corpus oracle and the seed-backed editor suites run beside it, in `checks-suites`.
  # ---------------------------------------------------------------------------
  checks:
    needs: seed
    if: needs.seed.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Restore vl-host binary
        uses: actions/cache/restore@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: ${{ needs.seed.outputs.bin_key }}
          fail-on-cache-miss: true

      - name: Restore the proven seed
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            build/vl-compiler.wasm.*.cwasm
          key: ${{ needs.seed.outputs.seed_key }}
          fail-on-cache-miss: true

      # `$VL_ISA` makes the cached sidecars load on any runner, so this is near-instant; it
      # stays as the net for a runner that refuses the pinned level, where every test worker
      # would otherwise JIT the seed at once.
      - name: Warm the seed's sidecars
        run: |
          grep -m1 'model name' /proc/cpuinfo
          bash scripts/warm-seed.sh

      # Dogfood: `vl` lints + fmt-checks its own source (`compiler/*.vl` + driver + `std/`),
      # gated at `info`, and holds the comment, kind-ladder, sentinel-index, arena-scan and
      # interp ratchets over the compiler-graph, std/ and scripts/ lints it makes
      # (`vl check --budget --findings`). STARTED in the
      # background so it overlaps the steps below; "Self-lint (result)" collects it.
      #
      # `set +e` FIRST: the step shell is `bash -e` and a subshell inherits errexit, so a
      # FAILING lint would abort at `timeout` and never write its rc. A leftover rc would
      # make the result step exit 0 on a lint that never ran, hence the `rm`.
      - name: Self-lint (start, concurrent with the steps below)
        run: |
          rm -f /tmp/lint-self.rc /tmp/lint-self.log
          ( set +e
            timeout 420 ./scripts/lint-self.sh > /tmp/lint-self.log 2>&1
            echo $? > /tmp/lint-self.rc ) < /dev/null > /dev/null 2>&1 &

      # The seed-size RATCHET, on the proven fixpoint (the artifact that ships), so its byte
      # count is the compiler's own codegen of itself. Growth past the bar fails.
      - name: Seed size (ratchet)
        run: scripts/vl-host/target/release/vl run scripts/seed-size.vl --compiler build/vl-compiler.wasm -- --check

      # No Python: a tracked .py file or a python invocation in a script fails.
      - name: No Python
        run: scripts/vl-host/target/release/vl run scripts/no-python.vl

      # Lane L7's invariant: no emitter module-scope state goes uncleared between compiles.
      - name: Emitter state (invariant)
        run: scripts/vl-host/target/release/vl run scripts/emitter-state-audit.vl -- --check

      # The capability probes' behavioural half: every witness-backed refusal still refuses
      # with its literal, and no probe traps the compiler, emits a module that does not
      # validate, or runs to the wrong answer (D2301).
      - name: Capability probes (live sites + clause-1 floor)
        run: |
          scripts/vl-host/target/release/vl run scripts/capability-probes.vl --compiler build/vl-compiler.wasm -- --live-sites --compiler build/vl-compiler.wasm
          scripts/vl-host/target/release/vl run scripts/capability-probes.vl --compiler build/vl-compiler.wasm -- --floor --compiler build/vl-compiler.wasm

      # The kind-ladder ratchet itself rides the self-lint; this re-derives the lint's copy
      # of every closed set from the `export type` that declares it and fails on drift.
      - name: Kind-ladder sets
        run: scripts/vl-host/target/release/vl run scripts/ladder-sets.vl --compiler build/vl-compiler.wasm

      # The dead-export RATCHET: `unused-function` exempts an exported declaration, which
      # for a tree whose only consumer is itself is a blind spot. Baseline at zero.
      - name: Dead-export budget (ratchet)
        run: |
          scripts/vl-host/target/release/vl run scripts/dead-exports.vl --compiler build/vl-compiler.wasm -- --out "$RUNNER_TEMP/dead-exports.json"
          scripts/vl-host/target/release/vl check --budget scripts/export-budget-baseline.json --findings "$RUNNER_TEMP/dead-exports.json" --compiler build/vl-compiler.wasm

      # The render-parse RATCHET: `tyToEmitName(` calls and the type-string parsers in the
      # emitter may only fall, so a rep is decided from the checked type.
      - name: Render-parse budget (ratchet)
        run: |
          scripts/vl-host/target/release/vl run scripts/render-parse-census.vl --compiler build/vl-compiler.wasm -- --out "$RUNNER_TEMP/render-parse.json"
          scripts/vl-host/target/release/vl check --budget scripts/render-parse-budget-baseline.json --findings "$RUNNER_TEMP/render-parse.json" --compiler build/vl-compiler.wasm

      # Collect the backgrounded self-lint. Bounded poll: the subshell wraps lint-self.sh
      # in `timeout 420`, so 450 s is a margin over that and a dead subshell fails fast.
      - name: Self-lint (result)
        run: |
          for _ in $(seq 1 450); do
            [ -f /tmp/lint-self.rc ] && break
            sleep 1
          done
          if [ ! -f /tmp/lint-self.rc ]; then
            echo "self-lint result never arrived after 450s; the subshell itself was killed." >&2
            cat /tmp/lint-self.log >&2 || true
            exit 1
          fi
          cat /tmp/lint-self.log
          exit "$(cat /tmp/lint-self.rc)"

  # ---------------------------------------------------------------------------
  # checks-suites — the seed-backed Deno suites that are not native: the editor features and
  # the corpus oracle. A job of their own so they run beside `checks`'s ratchets rather than
  # after them; the editor step stays first, followed by another step, because
  # scripts/gate.sh reads its file list up to the next `- name:`.
  # ---------------------------------------------------------------------------
  checks-suites:
    needs: seed
    if: needs.seed.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # Two runners, not two steps in turn: the editor suites (~16 s) and the oracle (~21 s) were
    # this job's whole 54 s and the CI critical path behind `seed` (run 41197363355).
    strategy:
      fail-fast: false
      matrix:
        part: [editor, oracle]
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Restore vl-host binary
        uses: actions/cache/restore@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: ${{ needs.seed.outputs.bin_key }}
          fail-on-cache-miss: true

      - name: Restore the proven seed
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            build/vl-compiler.wasm.*.cwasm
          key: ${{ needs.seed.outputs.seed_key }}
          fail-on-cache-miss: true

      - name: Warm the seed's sidecars
        run: |
          grep -m1 'model name' /proc/cpuinfo
          bash scripts/warm-seed.sh

      # The seed-backed LSP / playground editor-feature suites. They gate on
      # build/vl-compiler.wasm and self-ignore in the `ci` job (no seed), so they run
      # explicitly here. tests/ci_seed_coverage_test.ts enforces the set complete, and
      # scripts/gate.sh extracts this list by the step's NAME.
      - name: Editor features on the wasm compiler
        if: matrix.part == 'editor'
        run: >-
          deno test -A --no-check --parallel
          tests/lsp_semantic_tokens_test.ts
          tests/lsp_inlay_hint_test.ts
          tests/lsp_undisplayable_type_test.ts
          tests/lsp_wasm_checker_test.ts
          tests/lsp_crossfile_test.ts
          tests/lsp_crossfile_wasm_test.ts
          tests/lsp_crossfile_refs_wasm_test.ts
          tests/lsp_member_completion_wasm_test.ts
          tests/lsp_getter_wasm_test.ts
          tests/lsp_unused_export_wasm_test.ts
          tests/lsp_document_highlight_wasm_test.ts
          tests/lsp_prepared_memo_wasm_test.ts
          tests/lsp_module_cache_wasm_test.ts
          tests/lsp_check_skip_wasm_test.ts
          tests/lsp_seed_status_test.ts
          tests/lsp_document_symbols_wasm_test.ts
          tests/lsp_code_lens_wasm_test.ts
          tests/lsp_rename_wasm_test.ts
          tests/lsp_signature_help_wasm_test.ts
          tests/lsp_lex_agreement_wasm_test.ts
          tests/lsp_auto_import_test.ts
          tests/lsp_ufcs_import_test.ts
          tests/lsp_organize_imports_test.ts
          tests/lsp_organize_imports_duplicate_test.ts
          tests/lsp_lossless_recovery_wasm_test.ts
          tests/lsp_hover_docs_test.ts
          tests/lsp_exact_const_hover_test.ts
          tests/lsp_completion_docs_test.ts
          tests/lsp_ufcs_docs_test.ts
          tests/lsp_field_docs_test.ts
          tests/lsp_type_completion_test.ts
          tests/lsp_large_file_wasm_test.ts
          tests/lsp_vl_root_test.ts
          tests/lsp_utf16_columns_test.ts
          tests/playground_lsp_wasm_test.ts
          tests/playground_completion_test.ts
          tests/playground_trap_frames_test.ts
          tests/playground_import_actions_test.ts

      # The corpus oracle on the wasm compiler: the full directive corpus adjudicated by the
      # proven seed under Deno. It carries the corpus's content: the native shards assert only
      # the host-face subset of it. Four files so `--parallel` spreads it over the cores; listed
      # rather than globbed so the seed-coverage test can hold this step to naming every
      # shard. (No test path in this comment: gate.sh's editor-list read runs into it.)
      - name: Corpus oracle on the wasm compiler
        if: matrix.part == 'oracle'
        run: >-
          deno test -A --parallel
          tests/cases_wasm_0_test.ts
          tests/cases_wasm_1_test.ts
          tests/cases_wasm_2_test.ts
          tests/cases_wasm_3_test.ts

  # ---------------------------------------------------------------------------
  # ci-release-shape — the binaryen-backed suites (`vl build -O3` opt / allocation-melt /
  # loop-shape / bench-shape rows, the buffer-view-bounds table + contract, the wasm-merge
  # extern link), which need `npm ci` (binaryen) and `wasm-tools`. Every gate in these files
  # is positive (seed, binary, binaryen), so the files that also match the native globs run
  # HERE only: this job is a strict superset of what the native shards would run of them.
  # The SUITES list is what tests/ci_seed_coverage_test.ts and scripts/ci-shard.sh read.
  # ---------------------------------------------------------------------------
  ci-release-shape:
    needs: seed
    if: needs.seed.outputs.heavy == 'true' && needs.seed.outputs.gated != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install node deps
        run: npm ci

      # The buffer-view-bounds suite's second gate: a prebuilt release tarball, cached on
      # its pinned version.
      - name: Cache wasm-tools
        id: wasmtools
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/wasm-tools
          key: wasm-tools-${{ runner.os }}-1.258.0

      - name: Install wasm-tools
        if: steps.wasmtools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          asset="wasm-tools-1.258.0-x86_64-linux.tar.gz"
          work="$(mktemp -d)"
          if ! gh release download v1.258.0 --repo bytecodealliance/wasm-tools \
                 --pattern "$asset" --dir "$work" --clobber 2>/dev/null; then
            curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v1.258.0/$asset" -o "$work/$asset"
          fi
          tar xzf "$work/$asset" -C "$work"
          mv "$work/wasm-tools-1.258.0-x86_64-linux/wasm-tools" ~/.local/bin/wasm-tools
          chmod +x ~/.local/bin/wasm-tools
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # binaryen's native release at npm's version: the same bytes as npm's JS build, at a
      # fraction of the CPU. A failed fetch leaves the suites on npm's.
      - name: Cache native binaryen
        uses: actions/cache@v5
        with:
          path: ~/.cache/vl/binaryen-*
          key: binaryen-${{ runner.os }}-${{ hashFiles('scripts/fetch-binaryen.sh') }}

      - name: Native binaryen
        run: |
          if d=$(bash scripts/fetch-binaryen.sh); then echo "VL_BINARYEN=$d" >> "$GITHUB_ENV"; fi

      - name: Restore vl-host binary
        uses: actions/cache/restore@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: ${{ needs.seed.outputs.bin_key }}
          fail-on-cache-miss: true

      - name: Restore the proven seed
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            build/vl-compiler.wasm.*.cwasm
          key: ${{ needs.seed.outputs.seed_key }}
          fail-on-cache-miss: true

      # `$VL_ISA` makes the cached sidecars load on any runner, so this is near-instant; it
      # stays as the net for a runner that refuses the pinned level, where every test worker
      # would otherwise JIT the seed at once.
      - name: Warm the seed's sidecars
        run: |
          grep -m1 'model name' /proc/cpuinfo
          bash scripts/warm-seed.sh

      - name: Release-profile suites (-O3 / wasm-opt / wasm-dis / wasm-tools shape)
        run: |
          files=$(bash scripts/ci-shard.sh release ${{ matrix.shard }} 4)
          [ -n "$files" ] || { echo "release shard ${{ matrix.shard }} of 4 is empty" >&2; exit 1; }
          # shellcheck disable=SC2086  # one argument per file
          deno test -A --no-check --parallel $files
        env:
          SELFHOST_NATIVE_ALIGN: "1"
          # The release set: scripts/ci-shard.sh reads this list, and the native shards skip it.
          SUITES: >-
            tests/selfhost_native_opt_test.ts
            tests/selfhost_native_release_test.ts
            tests/selfhost_native_release_loops_test.ts
            tests/selfhost_native_release_melt_test.ts
            tests/selfhost_native_release_shape_test.ts
            tests/selfhost_native_release_leaf_test.ts
            tests/selfhost_native_release_runonce_test.ts
            tests/selfhost_native_release_escape_test.ts
            tests/vl_buffer_view_bounds_shape_test.ts
            tests/vl_extern_link_test.ts
            tests/vl_extern_global_test.ts
            tests/vl_deep_else_chain_test.ts
            tests/vl_getter_body_shape_test.ts
            tests/vl_closure_lift_shape_test.ts

  # ---------------------------------------------------------------------------
  # ci-cost — the generated-code and compile-shape COST ratchets, on master pushes and
  # nightly rather than per PR. Both grade guest FUEL, a count no runner can move, so they
  # are not flaky; they are scheduled because a cost regression is a price to name, not a
  # correctness failure, and these two were a fifth of the native suites' CPU. `scripts/gate.sh`
  # still runs both on every local gate. Split four ways so the slowest part, not their sum,
  # follows `seed`: plumb-shape alone, and the scaling-shape file in thirds
  # (`$VL_SCALING_SHARD`), each pair still graded whole inside one job. `seed` warms the two
  # fuel sidecars once, beside its ladder, and every part restores them.
  # ---------------------------------------------------------------------------
  ci-cost:
    needs: seed
    if: github.event_name != 'pull_request' && needs.seed.outputs.heavy == 'true' && needs.seed.outputs.gated != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [plumb, "1", "2", "3"]
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Restore vl-host binary
        uses: actions/cache/restore@v5
        with:
          path: scripts/vl-host/target/release/vl
          key: ${{ needs.seed.outputs.bin_key }}
          fail-on-cache-miss: true

      - name: Restore the proven seed
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            build/vl-compiler.wasm.*.cwasm
          key: ${{ needs.seed.outputs.seed_key }}
          fail-on-cache-miss: true

      # Restore-only: `seed` wrote this key, so the two fuel JITs become links. Not
      # `fail-on-cache-miss`: a sidecar is a cache, so a miss costs the warm below, never a grade.
      - name: Restore the fuel sidecars
        uses: actions/cache/restore@v5
        with:
          path: build/fuel-sidecars
          key: vl-fuel-${{ needs.seed.outputs.seed_key }}

      # Near-instant after the restore above; it re-warms only what the restore missed, and is
      # the net for a runner that refuses the pinned `$VL_ISA` level.
      - name: Warm the seed's sidecars
        run: |
          grep -m1 'model name' /proc/cpuinfo
          bash scripts/warm-seed.sh --fuel --stash build/fuel-sidecars

      # Guest fuel and peak RSS of one `-O` build of each of two plumb-shaped units. No
      # binaryen here, so `-O`'s wasm-opt step is skipped; the tool reads each build's
      # rusage through GNU time, which it refuses to run without.
      - name: Plumb-shape cost (ratchet)
        if: matrix.part == 'plumb'
        run: |
          test -x /usr/bin/time || (sudo apt-get update -q && sudo apt-get install -y -q time)
          scripts/vl-host/target/release/vl run scripts/plumb-shape-cost.vl --compiler build/vl-compiler.wasm -- --check --require-fuel

      # Same-work-different-shape program pairs graded on the ratio of their guest fuel.
      - name: Cost ratchets (scaling shape)
        if: matrix.part != 'plumb'
        run: deno test -A --no-check tests/vl_scaling_shape_test.ts
        env:
          SELFHOST_NATIVE_ALIGN: "1"
          VL_SCALING_SHARD: ${{ matrix.part }}/3

  # ---------------------------------------------------------------------------
  # ci-embed-seed — the release DISTRIBUTION build (roadmap H-M2), gated on every
  # push instead of only at release time.
  #
  # A SEPARATE, PARALLEL job because it is the only remaining cargo consumer and
  # it shares nothing with the native suites. Measured 2026-07-29 over the last
  # 30 full master-push runs it cost that job 15 s of `cargo build` PLUS the 17 s
  # ~1.2 GB target-dir restore it was the only reason to pay — 32 s of a 89 s
  # median critical path, for work nothing downstream consumes. Out here it runs
  # concurrently and costs the wall clock nothing.
  #
  # What it asserts is UNCHANGED: `--features embed-seed` compiles, the resulting
  # binary runs from a directory with NO on-disk seed (forcing the embedded
  # fallback), and its Cranelift compilation cache materializes so a shipped `vl`
  # does not re-JIT the seed every invocation.
  #
  # The seed it embeds comes from the same rolling cache the `seed` job writes, else
  # `scripts/fetch-seed.sh`. It deliberately does NOT wait for the `seed` job's
  # freshly refreshed seed: every assertion here is about the DISTRIBUTION
  # MECHANISM (build.rs staging, the embedded fallback, the cache key), and any
  # healthy seed exercises all of it. The seed's own correctness is proven in
  # the `seed` job by the fixpoint ladder, which is where that gate belongs.
  # ---------------------------------------------------------------------------
  ci-embed-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect docs-only change
        id: docs_check
        uses: ./.github/actions/docs-only

      - name: Decide what this run repeats
        id: verdict
        uses: ./.github/actions/ci-verdict
        with:
          docs_only: ${{ steps.docs_check.outputs.docs_only }}
          modes: inherit

      - name: Rustc version (cargo cache key)
        if: steps.verdict.outputs.heavy == 'true'
        id: rustc
        run: echo "v=$(rustc -V | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      # RESTORE-ONLY, on the `seed` job's key. This job's target dir holds
      # `--features embed-seed` artifacts, and writing those under the shared key
      # would hand `seed` a target dir whose `release/vl` is the embed-seed
      # binary. `seed` is the writer: any input that busts this key (rustc,
      # Cargo.lock, Cargo.toml) also busts its `vl-bin` key, so it always misses,
      # restores, builds and saves. One cold wasmtime build after a toolchain bump
      # is the same cost as before the split.
      - name: Restore cargo + vl-host target
        if: steps.verdict.outputs.heavy == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/vl-host/target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('scripts/vl-host/Cargo.lock', 'scripts/vl-host/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rustc.outputs.v }}-
            cargo-${{ runner.os }}-

      # Also RESTORE-ONLY: any healthy seed will do here (see the job header), so
      # a restore-keys hit is a full hit and the fetch below covers a cold cache —
      # while `seed` stays the sole writer of the seed pair, which is what
      # keeps the `.cwasm` sidecars riding along with the wasm they were built from.
      - name: Restore seed compiler wasm
        if: steps.verdict.outputs.heavy == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            build/vl-compiler.wasm.*.cwasm
          key: vl-seed4-${{ runner.os }}-${{ hashFiles('compiler/*.vl') }}
          restore-keys: |
            vl-seed4-${{ runner.os }}-

      # Idempotent: fetch-seed.sh leaves a present, non-empty seed untouched.
      - name: Ensure a seed to embed
        if: steps.verdict.outputs.heavy == 'true'
        run: ./scripts/fetch-seed.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify embedded-seed build (distribution path)
        if: steps.verdict.outputs.heavy == 'true'
        run: |
          cargo build --release --features embed-seed --manifest-path scripts/vl-host/Cargo.toml
          probe="$(mktemp -d)"
          # Isolated cache dir: the embedded seed has no `build/` beside it, so its
          # Cranelift compilation is cached here instead. Cold-compiling the ~1 MB seed
          # takes SECONDS; every run after the first deserializes in milliseconds.
          export VL_CACHE_DIR="$(mktemp -d)"
          vl="$GITHUB_WORKSPACE/scripts/vl-host/target/release/vl"
          out="$(cd "$probe" && echo 'print(6 * 7)' | "$vl" run)"
          if [ "$out" != "42" ]; then
            echo "embedded-seed smoke failed: expected 42 from the embedded fallback, got: $out"
            exit 1
          fi
          # The cache must MATERIALIZE — without it the shipped binary re-compiles the
          # seed on every invocation. Deterministic check; timings are informational
          # (runner-speed dependent, so never a gate).
          if ! ls "$VL_CACHE_DIR"/seed-*.cwasm >/dev/null 2>&1; then
            echo "embedded-seed cache was not written to \$VL_CACHE_DIR — every run would re-compile the seed"
            exit 1
          fi
          out2="$(cd "$probe" && echo 'print(6 * 7)' | "$vl" run)"
          if [ "$out2" != "42" ]; then
            echo "embedded-seed cached run failed: expected 42, got: $out2"
            exit 1
          fi
          echo "embedded-seed build runs with no on-disk seed (got 42), and caches its compile:"
          ls -la "$VL_CACHE_DIR"

      # THE DISTRIBUTION CONTRACT, ASSERTED FROM A DIRECTORY WITH NO TREE ABOVE IT
      # (D1573/D1574). `$probe` is under /tmp, so no ancestor holds a `std/` or a
      # `build/` — a std import that resolves here resolved out of the BINARY, which
      # is the whole claim. The stale-seed row is the other half: a released `vl`
      # must not become a different compiler because of what sits in the CWD.
      - name: Verify a released `vl` carries std and ignores the CWD
        if: steps.verdict.outputs.heavy == 'true'
        run: |
          set -e
          export VL_CACHE_DIR="$(mktemp -d)"
          vl="$GITHUB_WORKSPACE/scripts/vl-host/target/release/vl"
          probe="$(mktemp -d)"
          cat > "$probe/pin.vl" <<'EOF'
          import { sorted } from "std:array"
          import { toString } from "std:fmt"
          import { toJson } from "std:json"

          const xs = sorted([3, 1, 2], (a, b) => a < b)
          const j = toJson(true)
          if (j is string) {
            print(toString(xs[0]) + toString(xs[1]) + toString(xs[2]) + " " + j)
          }
          EOF
          out="$(cd "$probe" && "$vl" run pin.vl)"
          if [ "$out" != "123 true" ]; then
            echo "a pinned vl must resolve std: out of itself; expected '123 true', got: $out"
            exit 1
          fi

          # `vl std --dump` is the sibling of `vl seed`: the sources a consumer would
          # have copied by hand, read back OUT of the binary, byte for byte.
          dump="$(mktemp -d)"
          "$vl" std --dump "$dump" > /dev/null
          if ! diff -r "$dump" "$GITHUB_WORKSPACE/std" --exclude='*.ts'; then
            echo "vl std --dump does not round-trip to the tree's std/ — the binary was"
            echo "built from a stale scripts/vl-host/src/std_embedded.rs (deno task gen-std)"
            exit 1
          fi

          # A stale ./build/vl-compiler.wasm must not decide which compiler this is.
          stale="$(mktemp -d)"
          mkdir -p "$stale/build"
          head -c 64 /dev/urandom > "$stale/build/vl-compiler.wasm"
          where="$(cd "$stale" && "$vl" seed --path)"
          if [ "$where" != "embedded" ]; then
            echo "a released vl took a seed from the current directory: $where"
            exit 1
          fi
          bytes="$(cd "$stale" && "$vl" seed | wc -c)"
          embedded_bytes="$("$vl" seed | wc -c)"
          if [ "$bytes" != "$embedded_bytes" ]; then
            echo "the resolved seed changed with the current directory: $bytes vs $embedded_bytes"
            exit 1
          fi
          echo "a released vl: std out of the binary from $probe, dump round-trips, CWD ignored"

  # ---------------------------------------------------------------------------
  # ci-proof — on a merge queue push only, the line scripts/ci-proof.sh reads to let
  # scripts/gate.sh skip the rows this run covered on the same tree: the tree, the sha256 of
  # the seed every job restored, and the rustc that built the host. It prints nothing unless
  # every job it needs passed, and a run that skipped a job (docs-only, gated) proves nothing.
  # tests/ci_proof_test.ts holds `needs` to every other job in this file.
  # ---------------------------------------------------------------------------
  ci-proof:
    needs: [ci, seed, ci-native, checks, checks-suites, ci-release-shape, ci-cost, ci-embed-seed]
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/vl-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Every job this proof covers passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY: ${{ needs.seed.outputs.heavy }}
          GATED: ${{ needs.seed.outputs.gated }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          [ -z "$bad" ] || { echo "no proof: $bad"; exit 1; }
          [ "$HEAVY" = true ] && [ "$GATED" != true ] || { echo "no proof: heavy=$HEAVY gated=$GATED"; exit 1; }

      - uses: actions/checkout@v5

      - name: Restore the proven seed
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vl-compiler.wasm
            build/vl-compiler.wasm.src
            build/vl-compiler.wasm.*.cwasm
          key: ${{ needs.seed.outputs.seed_key }}
          fail-on-cache-miss: true

      - name: Proof line
        env:
          RUSTC: ${{ needs.seed.outputs.rustc }}
        run: |
          echo "ci-proof: tree $(git rev-parse HEAD^{tree}) seed $(sha256sum build/vl-compiler.wasm | cut -d' ' -f1) rustc $RUSTC"
